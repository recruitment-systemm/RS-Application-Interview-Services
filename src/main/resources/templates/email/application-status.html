<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Application Update</title>
</head>
<body style="margin:0; padding:0; background-color:#F8FAFC; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8FAFC; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#FFFFFF; border-radius:12px; overflow:hidden; border:1px solid #E2E8F0;">
          <tr>
            <td style="background-color:#2563EB; padding:20px 32px;">
              <span style="font-size:18px; font-weight:bold; color:#FFFFFF;">HireDesk</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 16px; font-size:20px; color:#0B1220;" th:text="${headline}">Application update</h1>
              <p style="margin:0 0 20px; font-size:14px; line-height:1.6; color:#334155;" th:text="${greeting}">Hi there,</p>
              <p style="margin:0 0 24px; font-size:14px; line-height:1.6; color:#334155;" th:utext="${message}">Message body.</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F1F5F9; border-radius:8px; margin-bottom:24px;">
                <tr>
                  <td style="padding:16px 20px;">
                    <p style="margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:#64748B;">Position</p>
                    <p style="margin:0 0 12px; font-size:14px; font-weight:bold; color:#0B1220;" th:text="${jobTitle}">Job title</p>
                    <p style="margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:#64748B;">Status</p>
                    <p style="margin:0; font-size:14px; font-weight:bold; color:#2563EB;" th:text="${statusLabel}">Status</p>
                  </td>
                </tr>
              </table>

              <div th:if="${notes != null and !notes.isEmpty()}" style="margin-bottom:24px;">
                <p style="margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:#64748B;">Notes</p>
                <p style="margin:0; font-size:14px; line-height:1.6; color:#334155;" th:text="${notes}">Notes</p>
              </div>

              <p style="margin:0; font-size:13px; line-height:1.6; color:#94A3B8;">
                This is an automated message from HireDesk. Please do not reply to this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
